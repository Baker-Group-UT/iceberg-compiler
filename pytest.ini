[pytest]
# Only look in tests/. Without this, bare `pytest` walks the whole repository and
# *imports* anything matching its default file globs -- which caught
# dag/circuit_dag_shor_test.py, a demo script whose name happens to end in `_test.py`.
# That file draws four figures at module level, so every test run opened four windows
# (and blocked on them under an interactive backend) while contributing zero tests, so
# the collected count never showed it.
testpaths = tests

# Drop the default `*_test.py` glob. Every real test file here is `test_*.py`, and the
# suffix form is what made a demo script look like a test suite.
python_files = test_*.py

# The matplotlib backend is forced to Agg in conftest.py rather than here, since the
# `env` ini option needs the pytest-env plugin and this project does not install it.
